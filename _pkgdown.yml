# Hosted on GitHub Pages, built by .github/workflows/pkgdown.yaml. To move
# it to a custom domain, change `url` and set the domain in the repository's
# Pages settings.
url: https://cshs-cwra.github.io/CSHShydRometry/

template:
  bootstrap: 5

# Not on CRAN yet, so there are no release dates to look up (the lookup
# also needs a network connection).
news:
  cran_dates: false

reference:
  - title: Fitting a single-segment curve
    desc: >
      Each function fits one model, and returns a fit that `predict()` and
      `coef()` work with.
    contents:
      - rc_powerlaw
      - rc_powerlaw_log
      - rc_poly
      - rc_loess

  - title: Fitting a two-segment curve
    contents:
      - rc_2seg_powerlaw

  - title: Variance
    desc: How the scatter of the gaugings about the curve is modelled.
    contents:
      - variance

  - title: Predicting, with confidence and prediction limits
    contents:
      - starts_with("predict.")

  - title: Fitted curves
    desc: What a fit contains, and the methods every fit shares.
    contents:
      - rating_curve
      - coef.rating_curve
      - fitted.rating_curve
      - print.rating_curve

  - title: Data
    contents:
      - thompson
